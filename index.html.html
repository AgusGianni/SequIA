<script>
  function showBootError(msg) {
    var box = document.getElementById('boot-error');
    if (!box) return;
    box.style.display = 'block';
    box.innerHTML = '<b>No se pudo cargar la app</b>' + msg;
  }
  window.addEventListener('error', function (e) {
    var detail = e.message || (e.error && e.error.message) || 'Error desconocido';
    var loc = e.filename ? (' — ' + e.filename.split('/').pop() + ':' + e.lineno) : '';
    showBootError(detail + loc);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    showBootError('Promesa rechazada: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {
        // si el service worker no se puede registrar (ej. abierto como archivo
        // local, sin https), la app sigue funcionando igual, solo sin offline
      });
    });
  }
</script>

// Google, "Measuring the environmental impact of delivering AI at Google Scale" (2025)
const GOOGLE_ELECTRICITY_WH = 0.24;   // Wh por prompt de texto mediano en Gemini Apps

// Metodología unificada con el sitio Sed de Datos:
// - Agua indirecta (la que se gasta en generar la electricidad): valor central de 1,5 L por kWh,
//   dentro del rango 0,5–2,5 L/kWh que usa la calculadora del sitio. Se aplica SOLO a la parte indirecta.
// - Agua directa (refrigeración): 0,26 mL por consulta mediana de Gemini (Google, 2025), el extremo bajo
//   del rango; el sitio usa además el extremo alto de UC Riverside (10–25 mL).
// - Escenario "mega centro de datos": Acero y Roca (2026) cita ≈7,1 m³ de agua por MWh (= 7,1 L/kWh)
//   para Stargate Argentina, sumando agua directa + indirecta. Es un escenario de referencia, no un
//   insumo del cálculo: usarlo como solo indirecto y sumar aparte los 0,26 mL directos contaría el agua dos veces.
const GRID_WATER_INTENSITY_L_PER_KWH = 1.5; // agua indirecta por kWh (valor central; rango 0,5–2,5)
const MEGA_DC_COMBINED_L_PER_KWH = 7.1;     // referencia: directa + indirecta combinadas (no entra en el cálculo)
// Los umbrales de agua por consulta de cada dificultad se calibraron con ~2 mL/consulta (versión anterior,
// con 7,1 L/kWh) y se reescalaron ×0,36 al pasar a 1,5 L/kWh para conservar la dificultad relativa.
const WATER_PENALTY_SLOPE = 8; // puntos de sostenibilidad perdidos por cada mL por encima del umbral (antes 3, con escala ×0,36)

const numFmt = (n, d = 2) => new Intl.NumberFormat("es-AR", { maximumFractionDigits: d }).format(n);

function formatWater(ml) {
  if (ml < 1000) return `${numFmt(ml, ml < 10 ? 2 : 1)} mL`;
  return `${numFmt(ml / 1000, 1)} L`;
}
function formatEnergy(wh) {
  if (wh < 1000) return `${numFmt(wh, wh < 10 ? 2 : 1)} Wh`;
  return `${numFmt(wh / 1000, 2)} kWh`;
}

// Anima un número hacia su nuevo valor cada vez que cambia (conteo animado
// tipo "juice" de videojuego, en vez de saltar directo al valor final).
function useAnimatedNumber(target, duration = 550) {
  const [display, setDisplay] = useState(target);
  const prevRef = useRef(target);
  useEffect(() => {
    const start = prevRef.current;
    const delta = target - start;
    if (delta === 0) return;
    const startTime = performance.now();
    let raf;
    const tick = (now) => {
      const t = Math.min(1, (now - startTime) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setDisplay(start + delta * eased);
      if (t < 1) raf = requestAnimationFrame(tick);
      else prevRef.current = target;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return display;
}

function App() {
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("inicio");
  const [showInstallGuide, setShowInstallGuide] = useState(false);
  const [gameActive, setGameActive] = useState(false);
  const [confirmExit, setConfirmExit] = useState(false);

  // Volver al inicio: si hay una partida en curso, antes pide confirmación.
  const goHome = () => {
    if (tab === "juego" && gameActive) { setConfirmExit(true); return; }
    if (tab === "inicio") { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    setTab("inicio");
  };

  useEffect(() => {
    if (typeof document !== "undefined") document.title = "SequIA — El costo oculto de la IA";
  }, []);

  // Pantalla de carga: se muestra unos instantes en cada ingreso y se desvanece.
  const [leaving, setLeaving] = useState(false);
  useEffect(() => {
    const t1 = setTimeout(() => setLeaving(true), 2300);
    const t2 = setTimeout(() => setLoaded(true), 2750);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);

  const [showTop, setShowTop] = useState(false);
  useEffect(() => {
    const onScroll = () => setShowTop(window.scrollY > 400);
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  if (!loaded) {
    const letters = [["S", "#14181F"], ["E", "#14181F"], ["Q", "#14181F"], ["U", "#14181F"], ["I", "#FF6A00"], ["A", "#FF6A00"]];
    return (
      <div style={{ ...splashStyles.wrap, opacity: leaving ? 0 : 1, transition: "opacity .45s ease" }} role="status" aria-label="Cargando SequIA">
        <GlobalStyle />
        <div className="hi-splash-logo" style={splashStyles.card}>
          <BrandMark size={64} />
          <h1 style={splashStyles.title} aria-label="SequIA">
            {letters.map(([ch, col], i) => <span key={i} className="hi-splash-letter" aria-hidden="true" style={{ color: col, animationDelay: `${0.25 + i * 0.09}s` }}>{ch}</span>)}
          </h1>
        </div>
        <div aria-hidden="true" style={splashStyles.track}><div className="hi-splash-fill" /></div>
      </div>
    );
  }

  return (
    <div style={styles.app}>
      <GlobalStyle />
      <BackgroundFX />
      <div style={styles.shell}>
        <Header onInstallClick={() => setShowInstallGuide(true)} onHomeClick={goHome} compact={tab !== "inicio"} />
        {tab !== "inicio" && (
          <button onClick={goHome} className="hi-btn" style={{ ...ghostBtn, marginBottom: 14 }}>
            ← Volver al inicio
          </button>
        )}

        {tab === "inicio" && <Inicio setTab={setTab} />}
        {tab === "laboratorio" && <LaboratorioTab setTab={setTab} />}
        {tab === "juego" && <Juego onActiveChange={setGameActive} />}
      </div>
      {showInstallGuide && <InstallGuideModal onClose={() => setShowInstallGuide(false)} />}
      {confirmExit && <ConfirmExitModal onCancel={() => setConfirmExit(false)} onConfirm={() => { setConfirmExit(false); setTab("inicio"); }} />}
      {showTop && (
        <button
          onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
          aria-label="Volver arriba"
          style={{
            position: "fixed", bottom: 20, right: 20, width: 44, height: 44, borderRadius: "50%",
            background: "var(--acc-blue)", border: "none", color: "var(--on-accent)", cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: "0 6px 18px rgba(20,24,31,0.18)", zIndex: 50
          }}
        >
          <ArrowUp size={18} />
        </button>
      )}
    </div>
  );
}

// Gauge semicircular tipo "sala de control": arco animado + número que
// cuenta hacia el nuevo valor, en vez de una barra de progreso plana.
function Gauge({ value, color, label }) {
  const animated = useAnimatedNumber(value);
  const prevRef = useRef(value);
  const [pulse, setPulse] = useState(false);
  useEffect(() => {
    if (prevRef.current !== value) {
      setPulse(true);
      prevRef.current = value;
      const t = setTimeout(() => setPulse(false), 600);
      return () => clearTimeout(t);
    }
  }, [value]);
  const r = 50;
  const arcLength = Math.PI * r;
  const filled = Math.max(0, Math.min(arcLength, arcLength * (animated / 100)));
  return (
    <div className="hi-card" style={{
      background: "var(--paper-soft)", borderRadius: 10, padding: "12px 14px 10px", textAlign: "center",
      boxShadow: pulse ? `0 0 0 3px ${color}55` : "0 0 0 0 transparent", transition: "box-shadow .6s ease",
    }}>
      <div style={{ position: "relative", width: "100%", maxWidth: 150, margin: "0 auto" }}>
        <svg viewBox="0 0 120 64" style={{ width: "100%", display: "block" }}>
          <path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="var(--paper)" strokeWidth="10" strokeLinecap="round" />
          <path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke={color} strokeWidth="10" strokeLinecap="round"
            strokeDasharray={`${filled} ${arcLength}`} />
        </svg>
        <div style={{ position: "absolute", left: 0, right: 0, bottom: -2, fontFamily: "var(--font-mono)", fontWeight: 700, fontSize: 20, color }}>
          {Math.round(animated)}
        </div>
      </div>
      <div style={{ fontSize: 10.5, fontWeight: 700, color: "var(--ink-soft)", textTransform: "uppercase", letterSpacing: "0.04em", marginTop: 4 }}>{label}</div>
    </div>
  );
}

function LaboratorioTab({ setTab }) {
  const [demand, setDemand] = useState(1500);
  const [tempMult, setTempMult] = useState(100);
  const [efficiency, setEfficiency] = useState(20);
  const [renewable, setRenewable] = useState(30);

  const whPerQuery = GOOGLE_ELECTRICITY_WH * (1 - efficiency / 100);
  const dailyKWh = (demand * whPerQuery) / 1000;
  const dailyDirectWaterMl = demand * GOOGLE_DIRECT_WATER_ML * (tempMult / 100);
  const dailyIndirectWaterL = dailyKWh * GRID_WATER_INTENSITY_L_PER_KWH * (1 - renewable / 100);
  const dailyTotalWaterL = dailyIndirectWaterL + dailyDirectWaterMl / 1000;

  const animKWh = useAnimatedNumber(dailyKWh, 280);
  const animTotalWaterL = useAnimatedNumber(dailyTotalWaterL, 280);
  const animDirectL = useAnimatedNumber(dailyDirectWaterMl / 1000, 280);
  const animIndirectL = useAnimatedNumber(dailyIndirectWaterL, 280);

  const glasses = (animTotalWaterL * 1000) / GLASS_OF_WATER_ML;
  const phoneCharges = animKWh / PHONE_CHARGE_KWH;

  const applyPreset = (p) => { setDemand(p.demand); setTempMult(p.tempMult); setEfficiency(p.efficiency); setRenewable(p.renewable); };

  const chartData = [
    { name: "Directa", value: Number(animDirectL.toFixed(3)) },
    { name: "Indirecta", value: Number(animIndirectL.toFixed(3)) },
  ];

  return (

}

// El pool de eventos depende de la dificultad: en Fácil solo hay climas y
// demanda (sin personajes ni decisiones), y en Difícil las crisis pesan más.
function pickEvent(diff) {
  const d = diff || GAME_DIFFICULTIES.normal;
  const pool = GAME_EVENTS
    .filter(e => d.characters || e.kind === "modifier")
    .filter(e => !(d.tier === 1 && (e.id === "cutback" || e.id === "drought")))
    .map(e => {
      let w = e.weight;
      if (e.kind === "modifier" && (e.resistible || e.id === "viral")) w *= d.harsh;
      if (e.kind !== "modifier" && d.tier === 3) w *= 1.5;
      return { e, w };
    });
  const total = pool.reduce((s, x) => s + x.w, 0);
  let r = Math.random() * total;
  for (const x of pool) {
    if (r < x.w) return x.e;
    r -= x.w;
  }
  return pool[0].e;
}

function rollDemand(day, diff, event) {
  const base = diff.demandBase + day * diff.demandStep;
  const noise = 0.85 + Math.random() * 0.3;
  const mult = event.kind === "modifier" ? event.demandMult : 1;
  return Math.round(base * noise * mult);
}

function gradeFor(score) {
  if (score >= 85) return { letter: "A", label: "Data center consciente", color: "var(--acc-green)" };
  if (score >= 65) return { letter: "B", label: "Bastante equilibrado", color: "var(--acc-teal)" };
  if (score >= 45) return { letter: "C", label: "A mitad de camino", color: "var(--acc-mustard)" };
  if (score >= 25) return { letter: "D", label: "Creció a las apuradas", color: "var(--acc-purple)" };
  return { letter: "F", label: "Data center voraz", color: "var(--acc-red)" };
}

function reputationGrade(score) {
  if (score >= 80) return { label: "Muy confiable", color: "var(--acc-green)" };
  if (score >= 55) return { label: "Reputación estable", color: "var(--acc-teal)" };
  if (score >= 30) return { label: "Bajo sospecha", color: "var(--acc-mustard)" };
  return { label: "Reputación dañada", color: "var(--acc-red)" };
}

function computeScores(state) {
  const conocimiento = state.knowledge.total > 0 ? Math.round((state.knowledge.correct / state.knowledge.total) * 100) : 50;
  const gestionHidrica = Math.round(Math.min(100, (state.cooling + state.renewable) / 1.8));
  const eficiencia = Math.round(Math.min(100, (state.efficiency / 60) * 70 + (state.renewable / 90) * 30));
  const transparencia = Math.round(Math.min(100, state.reputation * (state.audited ? 1.1 : 1)));
  const impacto = Math.round(state.sustainability);
  return { conocimiento, gestionHidrica, eficiencia, transparencia, impacto };
}

// Globo de ayuda anclado al botón (ⓘ) que lo abrió: aparece justo debajo o
// arriba del botón según el espacio disponible, y se mantiene dentro de la
// pantalla. Si no hay botón de referencia, se centra.
function InfoModal({ info, anchor, onClose, onGuide }) {
  const data = INFO_TEXTS[info];
  const popRef = useRef(null);
  const [pos, setPos] = useState(null);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  useEffect(() => {
    const place = () => {
      const pop = popRef.current;
      if (!pop) return;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const margin = 12;
      const width = Math.min(340, vw - margin * 2);
      const popH = pop.offsetHeight;
      const r = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : null;
      if (!r) {
        setPos({ left: (vw - width) / 2, top: Math.max(margin, (vh - popH) / 2), width, arrow: null });
        return;
      }
      const cx = r.left + r.width / 2;
      const left = Math.min(Math.max(cx - width / 2, margin), vw - width - margin);
      const spaceBelow = vh - r.bottom - margin;
      const spaceAbove = r.top - margin;
      const below = popH + 8 <= spaceBelow || spaceBelow >= spaceAbove;
      let top = below ? r.bottom + 8 : r.top - 8 - popH;
      top = Math.max(margin, Math.min(top, vh - popH - margin));
      const clear = below ? top >= r.bottom + 2 : top + popH <= r.top - 2;
      const arrowX = Math.min(Math.max(cx - left, 18), width - 18);
      setPos({ left, top, width, arrow: clear ? { x: arrowX, below } : null });
    };
    place();
    window.addEventListener("resize", place);
    window.addEventListener("scroll", place, true);
    return () => {
      window.removeEventListener("resize", place);
      window.removeEventListener("scroll", place, true);
    };
  }, [info, anchor]);

  if (!data) return null;
  const arrowBorders = pos && pos.arrow && pos.arrow.below
    ? { borderRight: "none", borderBottom: "none" }
    : { borderLeft: "none", borderTop: "none" };
  // Se dibuja en document.body (portal) para que el posicionamiento fijo sea
  // respecto de la pantalla y no de un contenedor con animación/transform.
  return createPortal(
    <div
      onClick={onClose}
      role="dialog"
      aria-modal="true"
      aria-label={data.title}
      style={{ position: "fixed", inset: 0, background: "rgba(20,24,31,0.18)", zIndex: 100 }}
    >
      <div
        ref={popRef}
        onClick={e => e.stopPropagation()}
        style={{
          position: "fixed", left: pos ? pos.left : 0, top: pos ? pos.top : 0, fontFamily: "var(--font-body)",
          width: pos ? pos.width : Math.min(340, window.innerWidth - 24),
          visibility: pos ? "visible" : "hidden",
        }}
      >
        <div style={{
          background: "var(--paper)", border: "1px solid var(--line)", borderRadius: 14, padding: "16px 16px 14px",
          maxHeight: "calc(100vh - 24px)", overflowY: "auto", position: "relative",
          boxShadow: "0 12px 32px rgba(20,24,31,0.22)",
        }}>
          <button onClick={onClose} aria-label="Cerrar" style={{
            position: "absolute", top: 10, right: 10, background: "var(--paper-soft)", border: "none",
            borderRadius: "50%", width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
          }}>
            <X size={14} color="var(--ink-soft)" />
          </button>

          <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 10, paddingRight: 30 }}>
            <div style={{ width: 30, height: 30, borderRadius: 9, background: "var(--acc-blue-bg)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              <Info size={16} color="var(--acc-blue)" />
            </div>
            <div style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontWeight: 700, fontSize: 14.5, color: "var(--ink)", lineHeight: 1.25 }}>{data.title}</div>
          </div>

          {data.body.map((p, i) => (
            <p key={i} style={{ fontSize: 12.5, color: "var(--ink)", lineHeight: 1.6, margin: "0 0 9px" }}>{p}</p>
          ))}

          {data.note && (
            <div style={{ background: "var(--paper-soft)", borderLeft: "3px solid var(--acc-blue)", borderRadius: 6, padding: "9px 11px", margin: "4px 0 12px" }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: "var(--acc-blue)", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 3 }}>Para tener en cuenta</div>
              <p style={{ fontSize: 11.5, color: "var(--ink-soft)", lineHeight: 1.55, margin: 0 }}>{data.note}</p>
            </div>
          )}

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: data.note ? 0 : 6 }}>
            <button onClick={onGuide} className="hi-btn" style={{ ...ghostBtn, flex: "1 1 140px", justifyContent: "center" }}>
              📖 Ver la guía paso a paso
            </button>
            <button onClick={onClose} className="hi-btn" style={{ ...primaryBtn, fontFamily: "var(--font-body)", flex: "1 1 100px", justifyContent: "center", background: "var(--acc-blue)", color: "#FFFFFF" }}>
              Entendido
            </button>
          </div>
        </div>
        {pos && pos.arrow && (
          <div aria-hidden="true" style={{
            position: "absolute", left: pos.arrow.x - 7, [pos.arrow.below ? "top" : "bottom"]: -7,
            width: 14, height: 14, background: "var(--paper)", transform: "rotate(45deg)",
            border: "1px solid var(--line)", ...arrowBorders,
          }} />
        )}
      </div>
    </div>,
    document.body
  );
}

// --- Gota: la mascota. Cambia de cara según cómo viene el agua de la partida ---
function gotaMood(sustainability) {
  if (sustainability >= 60) return "happy";
  if (sustainability >= 45) return "ok";
  if (sustainability >= 30) return "worried";
  return "sad";
}

function GotaMascot({ mood = "ok", size = 56, react }) {

function gotaSays(state) {
  const r = state.dayResult;
  if (r) {
    if (r.blocked) return "No te alcanzó el presupuesto para eso. ¡Mañana probamos otra cosa!";
    if (r.unmet > 0) return "Quedaron consultas sin atender. Más servidores ayudan.";
    if (r.sustainDelta > 0) return "¡Muy bien! Hoy cuidaste el agua.";
    if (r.sustainDelta < 0) return "Hoy se gastó bastante agua. Probá enfriar mejor o usar energía limpia.";
    return "Día tranquilo. ¡Seguimos!";
  }
  if (state.event && state.event.kind === "modifier" && state.event.id !== "calm") return `${state.event.emoji} ${state.event.label}: ${state.event.desc}`;
  if (state.day === 1) return "¡Hola! Soy Gota. Cada día elegí una mejora y confirmá. Yo te acompaño.";
  return "Elegí una mejora o ahorrá el día. ¡Vos mandás!";
}

// ---------- Sonido y vibración (síntesis simple con Web Audio, sin archivos) ----------
const sfx = (() => {
  let ctx = null;
  let muted = false;
  try { muted = window.localStorage.getItem("sequia-muted") === "1"; } catch (e) { /* sin almacenamiento */ }
  const getCtx = () => {
    try {
      if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); }
      if (ctx && ctx.state === "suspended") ctx.resume();
    } catch (e) { ctx = null; }
    return ctx;
  };
  const tone = (freq, start, dur, type, vol, slideTo) => {
    const c = getCtx();
    if (!c) return;
    const t0 = c.currentTime + start;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  };
  const buzz = (pattern) => {
    try {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (e) { /* sin vibración */ }
  };
  return {
    get muted() { return muted; },
    setMuted(v) { muted = v; try { window.localStorage.setItem("sequia-muted", v ? "1" : "0"); } catch (e) { /* sin almacenamiento */ } },
    play(kind) {
      if (muted) return;
      try {
        if (kind === "tick") tone(520, 0, 0.06, "triangle", 0.07);
        if (kind === "build") { tone(440, 0, 0.08, "square", 0.04); tone(660, 0.07, 0.1, "square", 0.04); buzz(20); }
        if (kind === "drop") tone(900, 0, 0.28, "sine", 0.12, 300);
        if (kind === "good") { tone(523, 0, 0.12, "sine", 0.1); tone(659, 0.1, 0.12, "sine", 0.1); tone(784, 0.2, 0.22, "sine", 0.1); buzz(30); }
        if (kind === "bad") { tone(300, 0, 0.22, "sawtooth", 0.05, 160); tone(200, 0.16, 0.28, "sawtooth", 0.05, 110); buzz([70, 40, 70]); }
        if (kind === "alert") { tone(380, 0, 0.14, "triangle", 0.08); tone(380, 0.18, 0.14, "triangle", 0.08); buzz([50, 30, 50]); }
      } catch (e) { /* el audio nunca debe romper el juego */ }
    },
  };
})();

// ---------- Tarjeta de resultado para compartir (se dibuja como imagen PNG) ----------
function cssVarValue(v) {
  const m = /^var\((--[\w-]+)\)$/.exec(v || "");
  if (!m) return v || "#14181F";
  try { return getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim() || "#14181F"; } catch (e) { return "#14181F"; }
}

function wrapCanvasText(g, text, x, y, maxW, lh) {
  const words = text.split(" ");
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (g.measureText(test).width > maxW && line) { g.fillText(line, x, y); line = w; y += lh; } else { line = test; }
  }
  if (line) { g.fillText(line, x, y); y += lh; }
  return y;
}

  g.fillStyle = INK; g.font = "400 62px 'Bowlby One', Newsreader, Georgia, serif"; g.fillText("SEQU", 120, 190); { const w0 = g.measureText("SEQU").width; g.fillStyle = "#FF6A00"; g.fillText("IA", 120 + w0, 190); }
  g.fillStyle = SOFT; g.font = "500 26px Inter, sans-serif";

  // Gota

  const drop = new Path2D("M60 6 C40 42, 12 70, 12 96 C12 122, 33 140, 60 140 C87 140, 108 122, 108 96 C108 70, 80 42, 60 6 Z");
  g.fillStyle = BLUE; g.fill(drop); g.lineWidth = 5; g.strokeStyle = INK; g.stroke(drop);
  g.fillStyle = "#FFFFFF"; g.beginPath(); g.arc(44, 80, 9, 0, 7); g.arc(76, 80, 9, 0, 7); g.fill();

  g.restore();
  // Final

  g.font = "120px sans-serif"; g.fillStyle = INK; g.fillText(d.emoji, W / 2, 470);
  g.fillStyle = d.color; g.font = "400 66px 'Bowlby One', Newsreader, Georgia, serif"; g.fillText(d.title.toUpperCase(), W / 2, 575);
  g.fillStyle = INK; g.font = "500 32px Inter, sans-serif";

  g.fillStyle = INK; g.font = "600 36px Inter, sans-serif"; g.fillText("de agua gastó mi centro de datos", W / 2, 990);
  g.fillStyle = SOFT; g.font = "500 32px Inter, sans-serif"; g.fillText(`≈ ${d.glasses} vasos de agua · ${d.served} consultas atendidas`, W / 2, 1050);
  g.fillStyle = INK; g.font = "600 30px Inter, sans-serif"; g.fillText(d.meta, W / 2, 1120);
  g.font = "700 36px Inter, sans-serif";
  { const p1 = "Jugá SequIA", p2 = ": sequ-ia.vercel.app"; const a = g.measureText("Jugá Sequ").width, b = g.measureText("IA").width, c = g.measureText(p2).width, x0 = W / 2 - (a + b + c) / 2;
    g.textAlign = "left"; g.fillStyle = BLUE; g.fillText("Jugá Sequ", x0, 1185); g.fillStyle = "#FF6A00"; g.fillText("IA", x0 + a, 1185); g.fillStyle = BLUE; g.fillText(p2, x0 + a + b, 1185); g.textAlign = "center"; }

function ShareCard({ state, ending, glasses, zone, diff }) {
  const [msg, setMsg] = useState("");
  const data = {
    emoji: ending.emoji, title: ending.title, tagline: ending.tagline, color: cssVarValue(ending.color), waterColor: cssVarValue("var(--acc-teal)"),
    water: numFmt(state.totalWaterL, 1), glasses: numFmt(glasses, 0), served: numFmt(state.totalServed, 0),
    meta: `Dificultad ${diff.label} · ${zone.label}`,
  };
  const share = async () => {
    try {
      const canvas = buildShareCanvas(data);
      const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
      if (!blob) throw new Error("sin imagen");
      const file = new File([blob], "sequia-resultado.png", { type: "image/png" });
      const text = `Mi centro de datos gastó ${data.water} L de agua en SequIA (${diff.label}). ¿Y el tuyo? https://sequ-ia.vercel.app/`;
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text, title: "SequIA" });
        setMsg("¡Listo!");
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "sequia-resultado.png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      setMsg("Imagen descargada: ya la podés compartir.");
    } catch (e) {
      if (e && e.name === "AbortError") return;
      setMsg("No se pudo generar la imagen en este dispositivo.");
    }
  };
  return (
    <div className="hi-card" style={{ background: "var(--paper)", border: "2px solid var(--ink)", boxShadow: "4px 4px 0 var(--ink)", borderRadius: 12, padding: "16px 18px", marginBottom: 14, textAlign: "center" }}>
      <div style={{ fontSize: 30 }}>{ending.emoji}</div>
      <div style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontWeight: 700, fontSize: 20, color: ending.color }}>{ending.title}</div>
      <div style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 40, color: "var(--acc-teal)", lineHeight: 1.1, marginTop: 6 }}>{data.water} L</div>
      <div style={{ fontSize: 12.5, color: "var(--ink-soft)", marginBottom: 12 }}>de agua gastó tu centro de datos · ≈ {data.glasses} vasos</div>
      <button onClick={share} className="hi-btn" style={{ ...primaryBtn, width: "100%", justifyContent: "center", background: "var(--acc-blue)" }}>
        Compartir mi resultado
      </button>
      <div role="status" aria-live="polite" style={{ fontSize: 12, color: "var(--ink-soft)", marginTop: msg ? 8 : 0 }}>{msg}</div>
    </div>
  );
}

function Juego({ onActiveChange }) {
  const [zone, setZone] = useState(null);
  const [diffKey, setDiffKey] = useState(null);
  const [state, setState] = useState(null);
  const [chosen, setChosen] = useState(null);
  const [showHelp, setShowHelp] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const [showSetup, setShowSetup] = useState(false);
  const [showZoneNumbers, setShowZoneNumbers] = useState(false);
  const [info, setInfo] = useState(null);

  // El agua acumulada de la partida sube por la pantalla.
  const waterL = state ? state.totalWaterL : 0;
  useEffect(() => {
    const lv = Math.min(0.35, 0.35 * (1 - Math.exp(-waterL / 3)));
    document.documentElement.style.setProperty("--water-lv", String(lv));
  }, [waterL]);
  useEffect(() => () => document.documentElement.style.setProperty("--water-lv", "0"), []);

  // Sonido y vibración: un "gota" al cerrar el día, y un aviso en las crisis.
  const [muted, setMuted] = useState(sfx.muted);
  const [pickN, setPickN] = useState(0);
  const resultKey = state && state.dayResult ? state.day : 0;
  useEffect(() => {
    if (!resultKey) return undefined;
    const r = state.dayResult;
    if (r.actionTaken) sfx.play("build");
    sfx.play("drop");
    const t = setTimeout(() => sfx.play(r.sustainDelta > 0 && r.unmet === 0 ? "good" : (r.sustainDelta < 0 || r.unmet > 0 ? "bad" : "tick")), 700);
    return () => clearTimeout(t);
  }, [resultKey]);
  const alertKey = state && !state.dayResult && state.event && state.event.kind === "modifier" && state.event.id !== "calm" ? `${state.day}-${state.event.id}` : "";
  useEffect(() => { if (alertKey) sfx.play("alert"); }, [alertKey]);

  // Hay "partida en curso" desde que arranca hasta que se muestra el resultado final.
  const inProgress = !!state && !state.finished;
  useEffect(() => {
    if (onActiveChange) onActiveChange(inProgress);
    return () => { if (onActiveChange) onActiveChange(false); };
  }, [inProgress, onActiveChange]);
  const [showGuide, setShowGuide] = useState(false);

  const startGame = (key) => {
    const fresh = freshGameState(key, zone);
    let event = pickEvent(fresh.diff);
    if (event.kind === "sources") {
      const scenario = pickSourceScenario([]);
      event = { ...event, scenario };
      fresh.usedSourceIds = [scenario.id];
    }
    fresh.event = event;
    fresh.eventChoiceResolved = event.kind !== "choice" && event.kind !== "sources";
    fresh.demand = rollDemand(1, fresh.diff, event);
    setDiffKey(key);
    setState(fresh);
    setChosen(null);
  };

  const resolveEventChoice = (optionId) => {
    setState(s => {
      const option = s.event.options.find(o => o.id === optionId);
      if (!option) return s;
      const { patch, note } = option.resolve(s);
      return { ...s, ...patch, eventChoiceResolved: true, eventChoiceNote: note };
    });
  };

  const resolveSourceChoice = (sourceId) => {
    setState(s => {
      const scenario = s.event.scenario;
      if (!scenario) return s;
      const source = scenario.sources.find(src => src.id === sourceId);
      if (!source) return s;
      const reliableSource = scenario.sources.find(src => src.reliable);
      let reputation = s.reputation;
      let knowledge = s.knowledge;
      let note;
      if (source.reliable) {
        reputation = Math.min(100, reputation + 8);
        knowledge = { correct: knowledge.correct + 1, total: knowledge.total + 1 };
        note = `Elegiste bien: "${source.label}" es la fuente confiable. ${source.detail} +8 de reputación.`;
      } else {
        reputation = Math.max(0, reputation - 5);
        knowledge = { correct: knowledge.correct, total: knowledge.total + 1 };
        note = `"${source.label}" no es confiable: ${source.detail} La fuente correcta era "${reliableSource.label}". -5 de reputación.`;
      }
      return { ...s, reputation, knowledge, eventChoiceResolved: true, eventChoiceNote: note };
    });
  };

  if (showGuide) {
    return <HowToPlayGuide onDone={() => setShowGuide(false)} />;
  }

  if (!zone) {
    return (
      <div>
        <DataCenterHero />
        <div style={{ background: "var(--dark-panel)", borderRadius: 16, padding: 20, marginBottom: 12, position: "relative", overflow: "hidden" }}>
          <div style={{ position: "absolute", inset: 0, backgroundImage: "radial-gradient(rgba(255,255,255,0.5) 1.2px, transparent 1.2px)", backgroundSize: "20px 20px", opacity: 0.08, pointerEvents: "none" }} />
          <div style={{ position: "relative" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
              <Gamepad2 size={17} color="#FFFFFF" />
              <div style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontWeight: 600, fontSize: 16, color: "#FFFFFF" }}><SeqName /></div>
            </div>
            <p style={{ fontSize: 12.5, color: "rgba(255,255,255,0.7)", margin: "0 0 12px" }}>
              Elegí dónde construir el centro de datos. Cada lugar tiene una ventaja y un problema: no hay una zona perfecta, y todas se pueden ganar.
            </p>
            <button onClick={() => setShowGuide(true)} className="hi-btn" style={{ ...primaryBtn, width: "100%", justifyContent: "center", background: "var(--acc-orange)", color: "#FFFFFF" }}>
              📖 ¿Primera vez? Ver la guía paso a paso
            </button>
          </div>
        </div>

        <button
          onClick={() => setZone(ZONES[Math.floor(Math.random() * ZONES.length)])}
          className="hi-btn hi-lift"
          style={{
            width: "100%", textAlign: "left", padding: "14px 16px", borderRadius: 8, cursor: "pointer",
            border: "1px dashed var(--acc-blue)", background: "var(--acc-blue-bg)", marginBottom: 8,
            display: "flex", alignItems: "center", gap: 10,
          }}
        >
          <Shuffle size={18} color="var(--acc-blue)" style={{ flexShrink: 0 }} />

            <div style={{ fontSize: 11.5, color: "var(--ink-soft)" }}>Si no te querés poner a pensar, dejá que decida la suerte</div>

                    <ChipIcon size={12} color={chip.tone} style={{ flexShrink: 0 }} />
                    <span style={{ fontSize: 10.5, color: "rgba(255,255,255,0.65)", flex: 1 }}>{chip.label}</span>
                    <span style={{ fontSize: 11, fontWeight: 700, color: chip.tone, fontFamily: "var(--font-mono)" }}>{chip.value}</span>
                  </div>
                );
              })}
            </div>}
          </button>
          <InfoButton dark onClick={(el) => setInfo({ key: "zone_" + z.id, anchor: el })} label={`Más información sobre ${z.label}`} style={{ position: "absolute", top: 12, right: 42 }} />
          </div>
        ))}

        <button onClick={() => setShowZoneNumbers(v => !v)} aria-expanded={showZoneNumbers} className="hi-btn" style={{ ...ghostBtn, width: "100%", justifyContent: "center", marginTop: 4 }}>
          {showZoneNumbers ? "Ocultar los números de cada zona" : "Ver los números de cada zona"}
        </button>
        {info && <InfoModal info={info.key} anchor={info.anchor} onClose={() => setInfo(null)} onGuide={() => { setInfo(null); setShowGuide(true); }} />}
      </div>
    );
  }

  if (!state) {
    return (
      <div>
        <div className="hi-card" style={{ background: "var(--paper)", borderRadius: 10, padding: 18, marginBottom: 12, borderTop: "4px solid var(--acc-blue)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
            <Gamepad2 size={17} color="var(--acc-blue)" />
            <div style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontWeight: 700, fontSize: 16, color: "var(--acc-blue)" }}><SeqName /></div>
          </div>
          <p style={{ fontSize: 12.5, color: "var(--ink-soft)", margin: 0 }}>
            {zone.emoji} Construyendo en {zone.label.replace(/^Zona [A-C] — /, "")}. Elegí cuánto juego querés: cuanto más difícil, más información y más objetivos.
          </p>
        </div>

        {Object.entries(GAME_DIFFICULTIES).map(([key, d]) => (
          <div key={key} style={{ position: "relative", marginBottom: 14 }}>
            <button
              onClick={() => startGame(key)}
              className="hi-btn hi-ink-rest"
              style={{ width: "100%", textAlign: "left", padding: "14px 52px 14px 16px", borderRadius: 10, cursor: "pointer", background: "var(--paper)", display: "block" }}
            >
              <div style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontSize: 20, fontWeight: 700, color: "var(--ink)" }}>{d.label}</div>
              <div style={{ fontSize: 12, fontWeight: 700, color: "var(--acc-blue)", marginTop: 2 }}>{d.tagline}</div>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 8 }}>
                <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-soft)" }}>{d.days} días · ${numFmt(Math.round(d.budget * zone.budgetMult), 0)}</span>
                <span style={{ display: "flex", gap: 4 }} aria-label={`Complejidad ${d.tier} de 3`}>
                  {[1, 2, 3].map(i => <span key={i} style={{ width: 9, height: 9, borderRadius: "50%", background: i <= d.tier ? "var(--acc-orange)" : "var(--line)" }} />)}
                </span>
              </div>
            </button>
            <InfoButton onClick={(el) => setInfo({ key: "diff_" + key, anchor: el })} label={`Qué incluye la dificultad ${d.label}`} style={{ position: "absolute", top: 14, right: 14 }} />
          </div>
        ))}

        <button onClick={() => setZone(null)} className="hi-btn" style={{ ...ghostBtn, marginTop: 4, marginRight: 8 }}>
          <RotateCcw size={13} /> Cambiar zona
        </button>
        <button onClick={() => setShowGuide(true)} className="hi-btn" style={{ ...ghostBtn, marginTop: 4, marginRight: 8 }}>
          📖 Ver guía paso a paso
        </button>
        <button onClick={() => setShowHelp(h => !h)} className="hi-btn" aria-expanded={showHelp} style={{ ...ghostBtn, marginTop: 4 }}>
          <Info size={13} /> {showHelp ? "Ocultar" : "Resumen rápido"}
        </button>
        {showHelp && (
          <div className="hi-card" style={{ background: "var(--paper-soft)", borderRadius: 8, padding: 14, marginTop: 8, fontSize: 12.5, color: "var(--ink)", lineHeight: 1.6 }}>
            Ya elegiste la zona y la dificultad. Cada día llega una demanda de consultas: elegís una inversión (enfriamiento, renovables, más capacidad, eficiencia de modelos o auditoría) o ahorrás.
            Comprar la misma mejora varias veces la hace más cara. Tu <strong>sostenibilidad</strong> sube o baja según cuánta agua gastás por consulta atendida,
            y tu <strong>reputación</strong> según la demanda que dejás sin atender y las decisiones que tomás. En el camino te vas a cruzar con <strong>personajes</strong> que te plantean decisiones,
            preguntas de <strong>Mito/Dato/Depende</strong> y casos donde tenés que elegir la fuente confiable. Las <strong>misiones</strong> marcan el rumbo de la partida, y si la sostenibilidad
            queda muy baja varios días seguidos, te llega una multa. Al final, tu resultado se resume en uno de 6 finales posibles y un ranking de 5 categorías.
          </div>
        )}
        {info && <InfoModal info={info.key} anchor={info.anchor} onClose={() => setInfo(null)} onGuide={() => { setInfo(null); setShowGuide(true); }} />}
      </div>
    );
  }

  const diff = state.diff;
  const easy = diff.tier === 1;
  const mood = gotaMood(state.sustainability);
  const gotaReact = state.dayResult ? (state.dayResult.sustainDelta > 0 && state.dayResult.unmet === 0 ? "good" : (state.dayResult.sustainDelta < 0 || state.dayResult.unmet > 0 ? "bad" : null)) : null;
  const visibleActions = GAME_ACTION_DEFS.filter(a => a.id !== "save" && diff.actions.includes(a.id));

  const resolveDay = () => {
    if (!chosen) return;
    const actionDef = GAME_ACTION_DEFS.find(a => a.id === chosen);
    const cost = costFor(actionDef, state);
    const canAfford = state.budget >= cost;
    const event = state.event;
    const resistFactor = state.resilience > 0 && event.resistible ? Math.max(0.5, 1 - state.resilience * 0.15) : 1;

    let { budget, capacity, cooling, renewable, efficiency, resilience, audited, reputation, purchases } = state;
    purchases = { ...purchases };
    let infraWaterAdded = 0;
    if (canAfford) {
      budget -= cost;
      if (actionDef.id === "cooling") { cooling = Math.min(90, cooling + 15); purchases.cooling++; }
      if (actionDef.id === "renewable") { renewable = Math.min(90, renewable + 15); purchases.renewable++; }
      if (actionDef.id === "capacity") { capacity += 400; purchases.capacity++; infraWaterAdded = 400 * INFRA_WATER_L_PER_CAPACITY_UNIT; }
      if (actionDef.id === "efficiency") { efficiency = Math.min(60, efficiency + 10); purchases.efficiency++; }
      if (actionDef.id === "resilience") { resilience = resilience + 1; purchases.resilience++; }
      if (actionDef.id === "audit") { audited = true; reputation = Math.min(100, reputation + 8); }
    }

    const effectiveCapacity = Math.round(capacity * (event.kind === "modifier" ? event.capacityMult : 1));
    const eventRenewableBonus = event.kind === "modifier" ? event.renewableBonus : 0;
    const effectiveRenewable = Math.min(95, renewable + eventRenewableBonus);
    const demand = state.demand;
    const served = Math.min(demand, effectiveCapacity);
    const unmet = Math.max(0, demand - effectiveCapacity);

    const whPerQuery = GOOGLE_ELECTRICITY_WH * (1 - efficiency / 100);
    const kWh = (served * whPerQuery) / 1000;
    const waterDirectMultRaw = event.kind === "modifier" ? event.waterDirectMult : 1;
    const waterDirectMult = (1 + (waterDirectMultRaw - 1) * resistFactor) * state.zone.waterDirectMult;
    const waterIndirectMultRaw = event.kind === "modifier" ? event.waterIndirectMult : 1;
    const waterIndirectMult = (1 + (waterIndirectMultRaw - 1) * resistFactor) * state.zone.waterIndirectMult;
    const waterDirectMl = served * GOOGLE_DIRECT_WATER_ML * (1 - cooling / 100) * waterDirectMult;
    const waterIndirectL = kWh * GRID_WATER_INTENSITY_L_PER_KWH * (1 - effectiveRenewable / 100) * waterIndirectMult;
    const waterTotalL = waterIndirectL + waterDirectMl / 1000 + infraWaterAdded;

    const repMultiplier = 0.7 + (reputation / 100) * 0.6;
    const revenue = served * 0.13 * repMultiplier;

    const waterPerQueryMl = served > 0 ? (waterTotalL * 1000) / served : 0;
    let sustainDelta = 0;
    if (served > 0) {
      sustainDelta += waterPerQueryMl <= diff.threshold ? 2 : -Math.min(10, Math.round((waterPerQueryMl - diff.threshold) * WATER_PENALTY_SLOPE * diff.severity));
    }
    let repDelta = 0;
    if (unmet > 0) repDelta -= Math.round(Math.min(8 * diff.repPenalty, (unmet / 200) * diff.repPenalty));
    if (event.id === "goodpress") repDelta += event.reputationBonus;

    const newSustainability = Math.max(0, Math.min(100, state.sustainability + sustainDelta));
    const newReputation = Math.max(0, Math.min(100, reputation + repDelta));
    budget += revenue;

    const lowSustainStreak = newSustainability < 35 ? state.lowSustainStreak + 1 : 0;
    let fine = 0;
    if (diff.fines && lowSustainStreak >= 2) {
      fine = 800;
      budget -= fine;
    }

    const dayResult = {
      day: state.day, event, served, unmet, kWh, waterDirectMl, waterIndirectL, waterTotalL,
      revenue, sustainDelta, repDelta, fine, actionTaken: canAfford ? actionDef : null, blocked: !canAfford, cost
    };

    // Cada 3 días (incluido el primero) aparece una afirmación Mito/Dato/Depende
    const triggersTrivia = diff.trivia && state.day % 4 === 1;

    setState(s => {
      const triviaItem = triggersTrivia ? pickTrivia(s.usedTriviaIds) : null;
      return {
        ...s,
        budget, capacity, cooling, renewable, efficiency, resilience, audited, purchases,
        sustainability: newSustainability,
        reputation: newReputation,
        lowSustainStreak,
        totalServed: s.totalServed + served,
        totalUnmet: s.totalUnmet + unmet,
        totalKWh: s.totalKWh + kWh,
        totalWaterL: s.totalWaterL + waterTotalL,
        totalDirectWaterL: s.totalDirectWaterL + waterDirectMl / 1000,
        totalIndirectWaterL: s.totalIndirectWaterL + waterIndirectL,
        totalInfraWaterL: s.totalInfraWaterL + infraWaterAdded,
        totalRevenue: s.totalRevenue + revenue,
        totalFines: s.totalFines + fine,
        history: [...s.history, dayResult],
        dayResult,
        trivia: triviaItem ? { ...triviaItem, chosen: null } : null,
        usedTriviaIds: triviaItem ? [...s.usedTriviaIds, triviaItem.id] : s.usedTriviaIds,
      };
    });
  };

  const answerTrivia = (choice) => {
    setState(s => {
      if (!s.trivia || s.trivia.chosen) return s;
      const correct = choice === s.trivia.answer;
      return {
        ...s,
        trivia: { ...s.trivia, chosen: choice, correct },
        knowledge: { correct: s.knowledge.correct + (correct ? 1 : 0), total: s.knowledge.total + 1 },
      };
    });
  };

  const nextDay = () => {
    setChosen(null);
    setState(s => {
      const day = s.day + 1;
      const finished = day > diff.days;
      const oldIdx = missionIndexForDay(s.day, diff.days, MISSION_DEFS.length);
      const newIdx = finished ? MISSION_DEFS.length : missionIndexForDay(day, diff.days, MISSION_DEFS.length);

      let reputation = s.reputation;
      let sustainability = s.sustainability;
      let missionsLog = s.missionsLog;
      let missionNote = null;

      if (diff.missions && newIdx !== oldIdx) {
        const missionDef = MISSION_DEFS[oldIdx];
        const met = missionDef.evaluate(s);
        if (met && missionDef.bonus) {
          if (missionDef.bonus.type === "reputation") reputation = Math.min(100, reputation + missionDef.bonus.amount);
          if (missionDef.bonus.type === "sustainability") sustainability = Math.min(100, sustainability + missionDef.bonus.amount);
        }
        missionsLog = [...missionsLog, { id: missionDef.id, title: missionDef.title, met, bonusLabel: missionDef.bonusLabel }];
        missionNote = { title: missionDef.title, met, bonusLabel: missionDef.bonusLabel };
      }

      if (finished) return { ...s, finished: true, dayResult: null, reputation, sustainability, missionsLog, missionNote };

      let event = pickEvent(diff);
      let usedSourceIds = s.usedSourceIds;
      if (event.kind === "sources") {
        const scenario = pickSourceScenario(usedSourceIds);
        event = { ...event, scenario };
        usedSourceIds = [...usedSourceIds, scenario.id];
      }
      return {
        ...s, day, event, reputation, sustainability, missionsLog, missionNote, usedSourceIds,
        currentMissionIndex: newIdx,
        eventChoiceResolved: event.kind !== "choice" && event.kind !== "sources",
        eventChoiceNote: null,
        demand: rollDemand(day, diff, event),
        dayResult: null,
        trivia: null,
      };
    });
  };

  const restart = () => {
    setState(null);
    setDiffKey(null);
    setChosen(null);
    setZone(null);
  };

  if (state.finished) {
    const glasses = (state.totalWaterL * 1000) / GLASS_OF_WATER_ML;
    const phoneCharges = state.totalKWh / PHONE_CHARGE_KWH;
    const achievements = computeAchievements(state);
    const scores = computeScores(state);
    const ending = computeEnding(state, scores);
    const avgScore = Math.round((scores.conocimiento + scores.gestionHidrica + scores.eficiencia + scores.transparencia + scores.impacto) / 5);

    return (
      <div>
        <div className="hi-card" style={{ background: ending.bg, borderRadius: 12, padding: "22px 20px", marginBottom: 14, textAlign: "center", border: `1px solid ${ending.color}`, position: "relative", overflow: "hidden" }}>
          {(ending.id === "innovador" || ending.id === "sostenible") && <Confetti />}
          <div className="hi-pop" style={{ fontSize: 34, marginBottom: 6 }}>{ending.emoji}</div>
          <div style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontWeight: 700, fontSize: 20, color: ending.color, marginBottom: 6 }}>{ending.title}</div>
          <p style={{ fontSize: 12.5, color: "var(--ink)", lineHeight: 1.6, margin: "0 auto", maxWidth: 480 }}>{ending.tagline}</p>
        </div>

        {easy && (
          <div className="hi-card" style={{ background: "var(--paper)", border: "2px solid var(--ink)", boxShadow: "3px 3px 0 var(--ink)", borderRadius: 10, padding: "14px 16px", marginBottom: 16, display: "flex", alignItems: "center", gap: 14 }}>
            <GotaMascot mood={state.sustainability >= 50 && state.budget > 0 ? "happy" : "worried"} size={54} />
            <div style={{ fontSize: 13.5, color: "var(--ink)", lineHeight: 1.5 }}>
              {state.sustainability >= 50 && state.budget > 0
                ? <><strong>¡Meta cumplida!</strong> Cuidaste el agua ({Math.round(state.sustainability)}%) y cerraste con plata.</>
                : <><strong>Casi.</strong> Tu meta era terminar con el agua cuidada en 50% o más y plata en el presupuesto. ¡Probá de nuevo!</>}
            </div>
          </div>
        )}
        {!easy && (<>
        <div className="hi-card" style={{ background: "var(--paper)", borderRadius: 10, padding: "12px 16px", marginBottom: 14, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>Ranking de esta partida</span>
          <span style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontWeight: 700, fontSize: 15, color: "var(--ink)" }}>{rankTitle(avgScore)} · {avgScore}/100</span>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(190px, 1fr))", gap: 8, marginBottom: 14 }}>
          <ScoreBar icon={Brain} color="var(--acc-indigo)" label="Conocimiento" value={scores.conocimiento} />
          <ScoreBar icon={Droplets} color="var(--acc-teal)" label="Gestión hídrica" value={scores.gestionHidrica} />
          <ScoreBar icon={Zap} color="var(--acc-mustard)" label="Eficiencia energética" value={scores.eficiencia} />
          <ScoreBar icon={MessageSquare} color="var(--acc-rose)" label="Transparencia" value={scores.transparencia} />
          <ScoreBar icon={Leaf} color="var(--acc-green)" label="Impacto ambiental" value={scores.impacto} />
        </div>
        </>)}

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 10, marginBottom: 14 }}>
          <StatBox icon={Users} color="var(--acc-blue)" bg="var(--acc-blue-bg)" value={numFmt(state.totalServed, 0)} label="Consultas atendidas" />
          <StatBox icon={Zap} color="var(--acc-mustard)" bg="var(--acc-mustard-bg)" value={formatEnergy(state.totalKWh * 1000)} label="Electricidad total" />
          <StatBox icon={Droplets} color="var(--acc-teal)" bg="var(--acc-teal-bg)" value={`${numFmt(state.totalWaterL, 1)} L`} label="Agua total" />
          <StatBox icon={Wallet} color="var(--acc-green)" bg="var(--acc-green-bg)" value={`$${numFmt(state.budget, 0)}`} label="Presupuesto final" />
        </div>

        {state.totalFines > 0 && (
          <div className="hi-card" style={{ background: "var(--acc-red-bg)", border: "1px solid var(--acc-red)", borderRadius: 8, padding: "10px 14px", marginBottom: 14, fontSize: 12.5, color: "var(--acc-red)" }}>
            Pagaste ${numFmt(state.totalFines, 0)} en multas por sostener la sostenibilidad demasiado baja demasiado tiempo.
          </div>
        )}

        {state.missionsLog && state.missionsLog.length > 0 && (
          <div className="hi-card" style={{ background: "var(--paper)", borderRadius: 10, padding: 16, marginBottom: 14 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}>
              <Compass size={15} color="var(--acc-purple)" />
              <div style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontWeight: 700, fontSize: 13, color: "var(--ink)" }}>Bitácora de misiones</div>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              {state.missionsLog.map((m, i) => (
                <div key={m.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, padding: "7px 0", borderBottom: i < state.missionsLog.length - 1 ? "1px solid var(--line)" : "none" }}>
                  <span style={{ color: "var(--ink)" }}>{m.title}</span>
                  <span style={{ color: m.met ? "var(--acc-green)" : "var(--ink-soft)", fontWeight: 700, fontSize: 11 }}>{m.met ? "Cumplida" : "No cumplida"}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {achievements.length > 0 && (
          <div className="hi-card" style={{ background: "var(--paper)", borderRadius: 10, padding: 16, marginBottom: 14 }}>
            <div style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontWeight: 700, fontSize: 13, marginBottom: 10, color: "var(--ink)" }}>Logros de esta partida</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {achievements.map(ach => {
                const Icon = ach.icon;
                return (
                  <span key={ach.label} style={{ display: "inline-flex", alignItems: "center", gap: 6, background: ach.color + "22", color: ach.color, borderRadius: 20, padding: "6px 12px", fontSize: 11.5, fontWeight: 600 }}>
                    <Icon size={12} /> {ach.label}
                  </span>
                );
              })}
            </div>
          </div>
        )}

        {diff.objectives && <ObjectivesPanel state={state} final />}
        {diff.dataPanel && <DataPanel state={state} defaultOpen />}

        <div className="hi-card" style={{ background: "var(--paper)", borderRadius: 10, padding: 18, marginBottom: 14 }}>
          <div style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontWeight: 700, fontSize: 14, marginBottom: 10, color: "var(--ink)" }}>El agua invisible de tu partida</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}>
              <span style={{ color: "var(--ink-soft)" }}>💧 Agua directa (refrigeración)</span>
              <span style={{ fontFamily: "var(--font-mono)", color: "var(--ink)" }}>{numFmt(state.totalDirectWaterL, 1)} L</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}>
              <span style={{ color: "var(--ink-soft)" }}>⚡ Agua indirecta (generar electricidad)</span>
              <span style={{ fontFamily: "var(--font-mono)", color: "var(--ink)" }}>{numFmt(state.totalIndirectWaterL, 1)} L</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}>
              <span style={{ color: "var(--ink-soft)" }}>🖥️ Agua de infraestructura (fabricar hardware)</span>
              <span style={{ fontFamily: "var(--font-mono)", color: "var(--ink)" }}>{numFmt(state.totalInfraWaterL, 1)} L</span>
            </div>
          </div>
          <p style={{ fontSize: 11.5, color: "var(--ink-soft)", lineHeight: 1.5, margin: 0 }}>
            La cifra de agua de infraestructura es una aproximación ilustrativa: es muy difícil de medir con precisión por servidor.
          </p>
        </div>

        <div className="hi-card" style={{ background: "var(--paper)", borderRadius: 10, padding: 18, marginBottom: 14 }}>
          <div style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontWeight: 700, fontSize: 14, marginBottom: 8, color: "var(--ink)" }}>Para ponerlo en contexto</div>
          <p style={{ fontSize: 13, color: "var(--ink)", lineHeight: 1.7, margin: 0 }}>
            Tu data center gastó el equivalente a <strong style={{ color: "var(--acc-teal)" }}>{numFmt(glasses, 0)} vasos de agua</strong> y
            {" "}<strong style={{ color: "var(--acc-blue)" }}>{numFmt(phoneCharges, 0)} cargas de celular</strong> a lo largo de {diff.days} días atendiendo consultas de IA en dificultad {diff.label.toLowerCase()}, en {zone.label}.
          </p>
        </div>

        <ShareCard state={state} ending={ending} glasses={glasses} zone={zone} diff={diff} />

        <button onClick={restart} className="hi-btn" style={{ ...primaryBtn, width: "100%", justifyContent: "center" }}>
          <RotateCcw size={14} /> Jugar de nuevo
        </button>
      </div>
    );
  }

  const canAffordChosen = chosen ? state.budget >= costFor(GAME_ACTION_DEFS.find(a => a.id === chosen), state) : true;

  return (
    <div key={`${state.day}-${state.dayResult ? "result" : "action"}`} className="hi-day-enter">
      {state.dayResult && (
        <svg key={`fall-${state.day}`} className="hi-fall" width="18" height="24" viewBox="0 0 12 16" aria-hidden="true">
          <path d="M6 1 C6 1, 1 7, 1 10.2 a5 5 0 0 0 10 0 C11 7, 6 1, 6 1 Z" fill="var(--acc-blue)" stroke="#FFFFFF" strokeWidth="1" />
        </svg>
      )}
      <div role="status" aria-live="polite" className="hi-sr">{`Día ${state.day} de ${diff.days}. ${gotaSays(state)}`}</div>
      <div className="hi-card" style={{ background: "var(--paper)", borderRadius: 10, padding: 18, marginBottom: 12, borderTop: "4px solid var(--acc-blue)" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            {!easy && <GotaMascot mood={mood} size={22} react={gotaReact} />}
            <div style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontWeight: 700, fontSize: 16, color: "var(--acc-blue)" }}><SeqName /></div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--ink-soft)" }}>Día {state.day} / {diff.days} · {diff.label} · {zone.emoji}</span>
