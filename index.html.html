              {muted ? "🔇" : "🔊"}
            </button>
            <button onClick={() => setShowGuide(true)} className="hi-btn" aria-label="Ver guía paso a paso" title="Ver guía paso a paso" style={{ background: "none", border: "none", cursor: "pointer", padding: 2, color: "var(--ink-soft)", display: "flex" }}>
              <Info size={15} />
            </button>
          </div>
        </div>
        {easy ? (
          <div style={{ display: "flex", alignItems: "center", gap: 14, marginTop: 8, paddingLeft: 4 }}>
            <GotaMascot mood={mood} size={64} react={gotaReact} />
            <div className="hi-bubble" key={gotaSays(state)} style={{ flex: 1 }}>{gotaSays(state)}</div>
          </div>
        ) : (
          <p style={{ fontSize: 12, color: "var(--ink-soft)", margin: 0 }}>
            Atendé consultas de IA sin descuidar el agua, la electricidad y tu reputación pública.
          </p>
        )}
        {(() => {
          const done = state.dayResult ? state.day : state.day - 1;
          const pct = Math.max(0, Math.min(100, (done / diff.days) * 100));
          return (
            <div style={{ position: "relative", height: 8, borderRadius: 4, background: "var(--paper-soft)", border: "1px solid var(--line)", margin: "14px 4px 4px" }} role="progressbar" aria-valuemin={0} aria-valuemax={diff.days} aria-valuenow={done} aria-label="Avance de la partida">
              <div style={{ width: `${pct}%`, height: "100%", borderRadius: 4, background: "linear-gradient(90deg, var(--acc-blue), var(--logo-cyan))", transition: "width .6s ease" }} />
              <svg width="16" height="20" viewBox="0 0 12 16" style={{ position: "absolute", top: "50%", left: `${pct}%`, transform: "translate(-50%, -52%)", transition: "left .6s ease", filter: "drop-shadow(0 2px 3px rgba(41,82,227,0.35))" }} aria-hidden="true">
                <path d="M6 1 C6 1, 1 7, 1 10.2 a5 5 0 0 0 10 0 C11 7, 6 1, 6 1 Z" fill="var(--acc-blue)" stroke="#FFFFFF" strokeWidth="1" />
              </svg>
            </div>
          );
        })()}
      </div>

      {/* Mapa del centro de datos: guardado para uso futuro. Para mostrarlo: <DataCenterMap state={state} /> */}

      {!state.dayResult && state.demand != null && (() => {
        const chosenDef = chosen ? GAME_ACTION_DEFS.find(a => a.id === chosen) : null;
        const addsCapacity = !!chosenDef && chosenDef.id === "capacity" && state.budget >= costFor(chosenDef, state);
        const eventCapMult = state.event && state.event.kind === "modifier" ? state.event.capacityMult : 1;
        const capacityToday = Math.round((state.capacity + (addsCapacity ? 400 : 0)) * eventCapMult);
        const missing = Math.max(0, state.demand - capacityToday);
        return (
          <div className="hi-card" style={{ background: "var(--paper)", borderRadius: 10, padding: "14px 16px", marginBottom: 12, position: "relative", border: `1px solid ${missing > 0 ? "var(--acc-red)" : "var(--line)"}` }}>
            <InfoButton onClick={(el) => setInfo({ key: "demand", anchor: el })} label="Más información sobre consultas y capacidad" style={{ position: "absolute", top: 10, right: 10 }} />
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, paddingRight: 28 }}>
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: "var(--ink-soft)", marginBottom: 2 }}><Users size={12} /> Consultas que llegan hoy</div>
                <div style={{ fontFamily: "var(--font-mono)", fontWeight: 700, fontSize: 22, color: "var(--ink)" }}>{numFmt(state.demand, 0)}</div>
              </div>
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: "var(--ink-soft)", marginBottom: 2 }}><Server size={12} /> Capacidad para atender</div>
                <div style={{ fontFamily: "var(--font-mono)", fontWeight: 700, fontSize: 22, color: "var(--acc-blue)" }}>{numFmt(capacityToday, 0)}</div>
              </div>
            </div>
            <div style={{ fontSize: 11.5, marginTop: 8, color: missing > 0 ? "var(--acc-red)" : "var(--acc-green)", fontWeight: 600 }}>
              {missing > 0
                ? `Te faltan ${numFmt(missing, 0)} de capacidad: esas consultas se pierden y bajan tu reputación.`
                : "✓ Podés atender todas las consultas de hoy."}
            </div>
          </div>
        );
      })()}

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
        <span style={{ fontSize: 11, fontWeight: 700, color: "var(--ink-soft)", textTransform: "uppercase", letterSpacing: "0.04em" }}>Tus números hasta ahora</span>
        <InfoButton onClick={(el) => setInfo({ key: "stats", anchor: el })} label="Más información sobre tus números" />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: `repeat(${diff.showEnergy ? 3 : 2}, 1fr)`, gap: 8, marginBottom: 10 }}>
        <StatBox icon={Droplets} color="var(--acc-teal)" bg="var(--acc-teal-bg)" value={`${numFmt(state.totalWaterL, 1)} L`} label="Agua acumulada" delay={0} />
        {diff.showEnergy && <StatBox icon={Zap} color="var(--acc-mustard)" bg="var(--acc-mustard-bg)" value={formatEnergy(state.totalKWh * 1000)} label="Energía acumulada" delay={40} />}
        <StatBox icon={Wallet} color="var(--acc-green)" bg="var(--acc-green-bg)" value={`$${numFmt(state.budget, 0)}`} label="Presupuesto" delay={80} />
      </div>

      {easy ? (
        <CareBar value={state.sustainability} label="Agua cuidada" />
      ) : (
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
        <div style={{ position: "relative" }}>
          <Gauge value={state.sustainability} color={gradeFor(state.sustainability).color} label="Sostenibilidad" />
          <InfoButton onClick={(el) => setInfo({ key: "sostenibilidad", anchor: el })} label="Más información sobre la sostenibilidad" style={{ position: "absolute", top: 8, right: 8 }} />
        </div>
        <div style={{ position: "relative" }}>
          <Gauge value={state.reputation} color={reputationGrade(state.reputation).color} label="Reputación" />
          <InfoButton onClick={(el) => setInfo({ key: "reputacion", anchor: el })} label="Más información sobre la reputación" style={{ position: "absolute", top: 8, right: 8 }} />
        </div>
      </div>
      )}

      {diff.objectives && <ObjectivesPanel state={state} />}
      {diff.dataPanel && <DataPanel state={state} />}

      {!easy && <button onClick={() => setShowSetup(v => !v)} aria-expanded={showSetup} className="hi-btn" style={{ ...ghostBtn, width: "100%", justifyContent: "center", marginBottom: showSetup ? 8 : 12 }}>
        <Sliders size={13} /> {showSetup ? "Ocultar mi configuración actual" : "Ver mi configuración actual"}
      </button>}

      {showSetup && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(105px, 1fr))", gap: 8, marginBottom: 12 }}>
          <StatBox icon={Snowflake} color="var(--acc-teal)" bg="var(--acc-teal-bg)" value={`${state.cooling}%`} label="Enfriamiento" />
          <StatBox icon={Wind} color="var(--acc-purple)" bg="var(--acc-purple-bg)" value={`${state.renewable}%`} label="Renovable" />
          <StatBox icon={Sliders} color="var(--acc-mustard)" bg="var(--acc-mustard-bg)" value={`${state.efficiency}%`} label="Eficiencia" />
        </div>
      )}

      {diff.fines && state.lowSustainStreak >= 1 && (
        <div role="alert" className="hi-card" style={{ display: "flex", gap: 8, alignItems: "center", background: "var(--acc-red-bg)", border: "1px solid var(--acc-red)", borderRadius: 8, padding: "9px 12px", marginBottom: 12 }}>
          <AlertTriangle size={14} color="var(--acc-red)" style={{ flexShrink: 0 }} />
          <span style={{ fontSize: 11.5, color: "var(--acc-red)" }}>Sostenibilidad muy baja hace {state.lowSustainStreak} día{state.lowSustainStreak > 1 ? "s" : ""}: si sigue así, te multan.</span>
        </div>
      )}

      {state.event && state.event.kind === "modifier" && state.event.id !== "calm" && !state.dayResult && (
        <div className="hi-alert-in" style={{ display: "flex", gap: 8, alignItems: "flex-start", background: "var(--acc-mustard-bg)", border: "1px solid var(--acc-mustard)", borderRadius: 8, padding: "10px 12px", marginBottom: 12 }}>
          <AlertTriangle size={15} color="var(--acc-mustard)" style={{ marginTop: 1, flexShrink: 0 }} />
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: "var(--acc-mustard)" }}>{state.event.emoji} {state.event.label}</div>
            <div style={{ fontSize: 12, color: "var(--ink)" }}>{state.event.desc}</div>
          </div>
        </div>
      )}

      {state.event && state.event.kind === "choice" && !state.eventChoiceResolved && (
        <div className="hi-card" style={{ background: "var(--acc-indigo-bg, var(--paper-soft))", border: `1px solid ${state.event.character ? state.event.character.color : "var(--acc-purple)"}`, borderRadius: 8, padding: "12px 14px", marginBottom: 12 }}>
          {state.event.character ? (
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
              <CharacterAvatar character={state.event.character} />
              <div>
                <div style={{ fontSize: 10.5, fontWeight: 700, color: state.event.character.color, textTransform: "uppercase", letterSpacing: "0.05em" }}>{state.event.character.name}</div>
                <div style={{ fontSize: 13, fontWeight: 700, color: state.event.character.color }}>
                  {state.event.label}{state.event.emoji !== state.event.character.emoji ? ` ${state.event.emoji}` : ""}
                </div>
              </div>
            </div>
          ) : (
            <div style={{ fontSize: 13, fontWeight: 700, color: "var(--acc-purple)", marginBottom: 4 }}>{state.event.emoji} {state.event.label}</div>
          )}
          <div style={{ fontSize: 12, color: "var(--ink)", marginBottom: 10, fontStyle: "italic" }}>{state.event.desc}</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {state.event.options.map(opt => (
              <button key={opt.id} onClick={() => resolveEventChoice(opt.id)} className="hi-btn" style={{ textAlign: "left", padding: "9px 12px", borderRadius: 6, border: "1px solid var(--line)", background: "var(--paper)", cursor: "pointer" }}>
                <div style={{ fontSize: 12.5, fontWeight: 600, color: "var(--ink)" }}>{opt.label}</div>
                <div style={{ fontSize: 11, color: "var(--ink-soft)" }}>{opt.effect}</div>
              </button>
            ))}
          </div>
        </div>
      )}

      {state.event && state.event.kind === "sources" && !state.eventChoiceResolved && state.event.scenario && (
        <div className="hi-card" style={{ background: "var(--acc-indigo-bg, var(--paper-soft))", border: `1px solid ${state.event.character ? state.event.character.color : "var(--acc-rose)"}`, borderRadius: 8, padding: "12px 14px", marginBottom: 12, position: "relative" }}>
          <InfoButton onClick={(el) => setInfo({ key: "sources", anchor: el })} label="Cómo reconocer una fuente confiable" style={{ position: "absolute", top: 10, right: 10 }} />
          {state.event.character ? (
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
              <CharacterAvatar character={state.event.character} />
              <div>
                <div style={{ fontSize: 10.5, fontWeight: 700, color: state.event.character.color, textTransform: "uppercase", letterSpacing: "0.05em" }}>{state.event.character.name}</div>
                <div style={{ fontSize: 13, fontWeight: 700, color: state.event.character.color }}>
                  {state.event.label}{state.event.emoji !== state.event.character.emoji ? ` ${state.event.emoji}` : ""}
                </div>
              </div>
            </div>
          ) : (
            <div style={{ fontSize: 13, fontWeight: 700, color: "var(--acc-rose)", marginBottom: 4 }}>{state.event.emoji} {state.event.label}</div>
          )}
          <div style={{ fontSize: 12, color: "var(--ink)", marginBottom: 10, fontStyle: "italic" }}>{state.event.scenario.prompt}</div>
          <div style={{ fontSize: 10.5, fontWeight: 700, color: "var(--ink-soft)", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 6 }}>ⓘ ¿Cuál es la fuente confiable?</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {state.event.scenario.sources.map(src => (
              <button key={src.id} onClick={() => resolveSourceChoice(src.id)} className="hi-btn" style={{ textAlign: "left", padding: "9px 12px", borderRadius: 6, border: "1px solid var(--line)", background: "var(--paper)", cursor: "pointer" }}>
                <div style={{ fontSize: 12.5, fontWeight: 600, color: "var(--ink)" }}>{src.label}</div>
                <div style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>{src.type}</div>
              </button>
            ))}
          </div>
        </div>
      )}

      {state.eventChoiceNote && !state.dayResult && (
        <div className="hi-card" style={{ background: "var(--paper-soft)", borderRadius: 8, padding: "9px 12px", marginBottom: 12, fontSize: 12, color: "var(--ink-soft)" }}>
          {state.eventChoiceNote}
        </div>
      )}

      {state.eventChoiceResolved && !state.dayResult && (
        <>
          <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 12 }}>
            {visibleActions.map(action => {
              const Icon = action.icon;
              const cost = costFor(action, state);
              const affordable = state.budget >= cost;
              const active = chosen === action.id;
              const disabledAudit = action.id === "audit" && state.audited;
              return (
                <div key={action.id} className={active ? "hi-pick" : undefined} style={{ position: "relative" }}>
                {active && <span key={"ring-" + pickN} className="hi-pick-ring" aria-hidden="true" style={{ borderColor: action.color }} />}
                <button
                  onClick={() => { if (!disabledAudit) { setChosen(action.id); setPickN(n => n + 1); sfx.play("tick"); } }}
                  className={active ? "hi-btn hi-ink" : "hi-btn hi-ink-rest"}
                  aria-disabled={disabledAudit}
                  aria-pressed={active}
                  style={{
                    width: "100%", textAlign: "left", padding: "11px 44px 11px 14px", borderRadius: 8, cursor: disabledAudit ? "default" : "pointer",
                    border: `1px solid ${active ? "var(--ink)" : "var(--line)"}`,
                    background: active ? "var(--paper-soft)" : "var(--paper)",
                    opacity: (affordable && !disabledAudit) ? 1 : 0.5,
                    display: "flex", alignItems: "center", gap: 10
                  }}
                >
                  <div key={active ? "on" + pickN : "off"} className={active ? "hi-icon-wig hi-pick-ico" : "hi-icon-wig"} style={{ width: 28, height: 28, borderRadius: 7, background: action.color + (active ? "44" : "22"), display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    <Icon size={14} color={action.color} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 12.5, fontWeight: 700, color: "var(--ink)" }}>
                      {easy && action.easyLabel ? action.easyLabel : action.label} {cost > 0 && <span style={{ fontFamily: "var(--font-mono)", fontWeight: 600, color: "var(--ink-soft)" }}>· ${numFmt(cost, 0)}</span>}
                    </div>
                    <div style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>
                      {disabledAudit ? "Ya hiciste una auditoría esta partida." : ((active || easy) ? (easy && action.easyDesc ? action.easyDesc : action.desc) : null)}
                      {!affordable && !disabledAudit ? " (no te alcanza el presupuesto)" : ""}
                    </div>
                  </div>
                  {active && (
                    <span className="hi-pick-check" aria-hidden="true" style={{ position: "absolute", top: -8, left: -8, width: 22, height: 22, borderRadius: "50%", background: action.color, color: "#fff", border: "2px solid var(--ink)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800, lineHeight: 1 }}>✓</span>
                  )}
                </button>
                <InfoButton onClick={(el) => setInfo({ key: action.id, anchor: el })} label={`Más información sobre ${action.label}`} style={{ position: "absolute", top: "50%", right: 10, transform: "translateY(-50%)" }} />
                </div>
              );
            })}
          </div>

          <div style={{ position: "relative", marginBottom: 12 }}>
          <button
            onClick={() => setChosen("save")}
            className="hi-btn"
            aria-pressed={chosen === "save"}
            style={{
              width: "100%", textAlign: "left", padding: "11px 44px 11px 14px", borderRadius: 8, cursor: "pointer", marginBottom: 0,
              border: `1px dashed ${chosen === "save" ? "var(--acc-blue)" : "var(--ink-soft)"}`,
              background: chosen === "save" ? "var(--acc-blue-bg)" : "transparent",
              display: "flex", alignItems: "center", gap: 10,
            }}
          >
            <div style={{ width: 28, height: 28, borderRadius: 7, background: "var(--paper-soft)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              <Wallet size={14} color={chosen === "save" ? "var(--acc-blue)" : "var(--ink-soft)"} />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: chosen === "save" ? "var(--acc-blue)" : "var(--ink)" }}>Pasar el día y ahorrar</div>
              <div style={{ fontSize: 11, color: "var(--ink-soft)" }}>No invertís nada hoy: guardás el presupuesto para más adelante.</div>
            </div>
          </button>
          <InfoButton onClick={(el) => setInfo({ key: "save", anchor: el })} label="Más información sobre pasar el día y ahorrar" style={{ position: "absolute", top: "50%", right: 10, transform: "translateY(-50%)" }} />
          </div>

          <button
            onClick={resolveDay}
            disabled={!chosen}
            className="hi-btn"
            style={{ ...primaryBtn, width: "100%", justifyContent: "center", opacity: chosen ? 1 : 0.5, cursor: chosen ? "pointer" : "default" }}
          >
            Confirmar día <ArrowRightIcon />
          </button>
        </>
      )}

      {state.dayResult && (
        <div className="hi-card" style={{ background: "var(--paper)", borderRadius: 10, padding: 18, border: "1px solid var(--line)", position: "relative", overflow: "hidden" }}>
          {easy && state.dayResult.sustainDelta > 0 && state.dayResult.unmet === 0 && <Confetti />}
          <div style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontWeight: 700, fontSize: 14, marginBottom: 10, color: "var(--ink)" }}>
            Resultado del día {state.dayResult.day}
          </div>
          {state.dayResult.blocked && (
            <p style={{ fontSize: 12, color: "var(--acc-red)", marginBottom: 8 }}>No te alcanzó el presupuesto, así que no se aplicó ninguna inversión hoy.</p>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(100px, 1fr))", gap: 8, marginBottom: 10 }}>
            <ResultBox icon={Users} color="var(--acc-blue)" bg="var(--acc-blue-bg)" label="Atendidas" value={numFmt(state.dayResult.served, 0)} />
            {diff.showEnergy && <ResultBox icon={Zap} color="var(--acc-mustard)" bg="var(--acc-mustard-bg)" label="Electricidad" value={formatEnergy(state.dayResult.kWh * 1000)} />}
            <ResultBox icon={Droplets} color="var(--acc-teal)" bg="var(--acc-teal-bg)" label="Agua total" value={`${numFmt(state.dayResult.waterTotalL, 2)} L`} />
          </div>
          {state.dayResult.unmet > 0 && (
            <p style={{ fontSize: 12, color: "var(--ink-soft)", marginBottom: 6 }}>
              No se pudo atender a {numFmt(state.dayResult.unmet, 0)} consultas por falta de capacidad.
            </p>
          )}
          {state.dayResult.fine > 0 && (
            <p style={{ fontSize: 12, color: "var(--acc-red)", marginBottom: 6 }}>
              Multa por sostenibilidad baja sostenida: -${numFmt(state.dayResult.fine, 0)}.
            </p>
          )}
          <div style={{ display: "flex", flexWrap: "wrap", gap: 14, marginBottom: 14 }}>
            <span className="hi-delta" style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 600, color: state.dayResult.sustainDelta >= 0 ? "var(--acc-green)" : "var(--acc-red)" }}>
              {state.dayResult.sustainDelta >= 0 ? <TrendingUp size={14} /> : <TrendingDown size={14} />}
              {state.dayResult.sustainDelta >= 0 ? "+" : ""}{state.dayResult.sustainDelta} {easy ? "agua cuidada" : "sostenibilidad"}
            </span>
            {diff.showRep && <span className="hi-delta" style={{ animationDelay: ".15s", display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 600, color: state.dayResult.repDelta >= 0 ? "var(--acc-green)" : "var(--acc-red)" }}>
              {state.dayResult.repDelta >= 0 ? <TrendingUp size={14} /> : <TrendingDown size={14} />}
              {state.dayResult.repDelta >= 0 ? "+" : ""}{state.dayResult.repDelta} reputación
            </span>}
          </div>
          {easy && (
            <div className="hi-card" style={{ background: "var(--acc-blue-bg)", borderRadius: 8, padding: "10px 12px", marginBottom: 14, fontSize: 12.5, color: "var(--ink)", lineHeight: 1.5 }}>
              💡 <strong>Dato curioso:</strong> {EASY_TIPS[(state.dayResult.day - 1) % EASY_TIPS.length]}
            </div>
          )}
          {state.trivia && (
            <div className="hi-card" style={{ background: "var(--acc-indigo-bg)", border: "1px solid var(--acc-indigo)", borderRadius: 8, padding: "12px 14px", marginBottom: 14 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
                <Brain size={14} color="var(--acc-indigo)" />
                <span style={{ fontSize: 11, fontWeight: 700, color: "var(--acc-indigo)", textTransform: "uppercase", letterSpacing: "0.04em" }}>Mito / Dato / Depende</span>
              </div>
              <p style={{ fontSize: 13, color: "var(--ink)", lineHeight: 1.5, margin: "0 0 10px" }}>{state.trivia.statement}</p>
              {!state.trivia.chosen ? (
                <div style={{ display: "flex", gap: 6 }}>
                  <button onClick={() => answerTrivia("verdadero")} className="hi-btn" style={{ flex: 1, padding: "8px 6px", borderRadius: 6, border: "1px solid var(--acc-green)", background: "var(--acc-green-bg)", color: "var(--acc-green)", fontWeight: 700, fontSize: 12, cursor: "pointer" }}>Verdadero</button>
                  <button onClick={() => answerTrivia("falso")} className="hi-btn" style={{ flex: 1, padding: "8px 6px", borderRadius: 6, border: "1px solid var(--acc-red)", background: "var(--acc-red-bg)", color: "var(--acc-red)", fontWeight: 700, fontSize: 12, cursor: "pointer" }}>Falso</button>
                  <button onClick={() => answerTrivia("depende")} className="hi-btn" style={{ flex: 1, padding: "8px 6px", borderRadius: 6, border: "1px solid var(--acc-mustard)", background: "var(--acc-mustard-bg)", color: "var(--acc-mustard)", fontWeight: 700, fontSize: 12, cursor: "pointer" }}>Depende</button>
                </div>
              ) : (
                <div style={{ display: "flex", gap: 8, alignItems: "flex-start", background: "var(--paper)", borderRadius: 6, padding: "10px 12px" }}>
                  {state.trivia.correct
                    ? <CheckCircle2 size={16} color="var(--acc-green)" style={{ flexShrink: 0, marginTop: 1 }} />
                    : <XCircle size={16} color="var(--acc-red)" style={{ flexShrink: 0, marginTop: 1 }} />}
                  <div>
                    <div style={{ fontSize: 12, fontWeight: 700, color: state.trivia.correct ? "var(--acc-green)" : "var(--acc-red)", marginBottom: 3 }}>
                      {state.trivia.correct ? "¡Correcto!" : `Incorrecto — la respuesta era "${state.trivia.answer}"`}
                    </div>
                    <p style={{ fontSize: 12, color: "var(--ink-soft)", lineHeight: 1.5, margin: 0 }}>{state.trivia.explanation}</p>
                  </div>
                </div>
              )}
            </div>
          )}

          <button
            onClick={nextDay}
            disabled={!!state.trivia && !state.trivia.chosen}
            className="hi-btn"
            style={{ ...primaryBtn, width: "100%", justifyContent: "center", opacity: (state.trivia && !state.trivia.chosen) ? 0.5 : 1, cursor: (state.trivia && !state.trivia.chosen) ? "default" : "pointer" }}
          >
            {state.day >= diff.days ? "Ver resultado final" : "Día siguiente"}
          </button>
        </div>
      )}

      {easy ? <GoalStrip state={state} /> : (
      <div className="hi-card" style={{ background: "var(--paper)", borderRadius: 10, padding: "12px 16px", marginTop: 12, marginBottom: 0, borderLeft: "4px solid var(--acc-purple)" }}>
        {state.missionNote && (
          <div style={{ marginBottom: 8, fontSize: 12, color: state.missionNote.met ? "var(--acc-green)" : "var(--ink-soft)" }}>
            {state.missionNote.met ? "✅" : "➖"} Misión "{state.missionNote.title}" {state.missionNote.met ? "cumplida" : "no cumplida"}
            {state.missionNote.met ? ` — ${state.missionNote.bonusLabel}` : ""}
          </div>
        )}
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
          <Compass size={14} color="var(--acc-purple)" />
          <span style={{ fontSize: 11, fontWeight: 700, color: "var(--acc-purple)", textTransform: "uppercase", letterSpacing: "0.04em" }}>
            Misión {state.currentMissionIndex + 1}/{MISSION_DEFS.length} · {MISSION_DEFS[state.currentMissionIndex].title}
          </span>
        </div>
        <p style={{ fontSize: 12.5, color: "var(--ink)", margin: "0 0 4px", lineHeight: 1.5 }}>{MISSION_DEFS[state.currentMissionIndex].narrative}</p>
        <p style={{ fontSize: 11, color: "var(--ink-soft)", margin: 0 }}>Objetivo: {MISSION_DEFS[state.currentMissionIndex].hint}</p>
      </div>
      )}

      {state.history.length > 0 && (
        <div style={{ marginTop: 12 }}>
          <button onClick={() => setShowHistory(h => !h)} className="hi-btn" aria-expanded={showHistory} style={ghostBtn}>
            <ChevronDown size={13} style={{ transform: showHistory ? "rotate(180deg)" : "rotate(0deg)", transition: "transform .2s" }} />
            {showHistory ? "Ocultar historial" : "Ver historial de días"}
          </button>
          {showHistory && (
            <div className="hi-card" style={{ background: "var(--paper)", borderRadius: 10, padding: 14, marginTop: 8, maxHeight: 220, overflowY: "auto" }}>
              {state.history.slice().reverse().map(h => (
                <div key={h.day} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid var(--line)", fontSize: 11.5 }}>
                  <span style={{ color: "var(--ink-soft)" }}>Día {h.day} · {h.event.emoji}</span>
                  <span style={{ fontFamily: "var(--font-mono)", color: "var(--ink)" }}>{numFmt(h.served, 0)} consultas · {numFmt(h.waterTotalL, 2)} L</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
      {info && <InfoModal info={info.key} anchor={info.anchor} onClose={() => setInfo(null)} onGuide={() => { setInfo(null); setShowGuide(true); }} />}
    </div>
  );
}

// Error Boundary: captura cualquier error de renderizado de React con su
// mensaje y stack reales. Sin esto, Babel compilando en el navegador hace
// que el handler global de arriba solo vea un "Script error." sin detalle.
class BootErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) {
    var msg = (error && error.message) ? error.message : String(error);
    var compStack = (info && info.componentStack) ? info.componentStack.split("\n").slice(0, 4).join("\n") : "";
    showBootError(msg + (compStack ? ("\n" + compStack) : ""));
  }
  render() {
    if (this.state.error) return null;
    return this.props.children;
  }
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<BootErrorBoundary><App /></BootErrorBoundary>);
} catch (err) {
  showBootError((err && err.message) ? err.message : String(err));
}
</script>
